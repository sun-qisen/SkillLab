<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TODO · 控制台</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --p0:#e5484d; --p1:#de8a0b; --p2:#3e63c7; --p3:#8a93a3;
  --go:#127a5b; --go-fill:#1aa277;
  --bg:#edeff3; --bg2:#e6e9ef;
  --card:#ffffff; --card2:#f7f8fb;
  --ink:#1e2430; --ink2:#3a414d; --mut:#68707e; --line:#e3e6ec;
  --side:#1e2430; --side-ink:#e9ecf2; --side-mut:#9aa2b1; --side-line:#2c333f;
  --sh1:0 1px 2px rgba(20,26,38,.06); --sh2:0 6px 20px -8px rgba(20,26,38,.14);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --r:14px; --r2:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --p0:#ff6169; --p1:#f2a93b; --p2:#7d97e6; --p3:#98a2b3;
    --go:#1fb688; --go-fill:#1fb688;
    --bg:#14171c; --bg2:#0f1216;
    --card:#1c212a; --card2:#20262f;
    --ink:#e7eaf1; --ink2:#c3c9d4; --mut:#8b93a3; --line:#2a303a;
    --side:#0f1216; --side-ink:#e7eaf1; --side-mut:#7d8593; --side-line:#242a33;
    --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 8px 24px -10px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:15px/1.55 var(--sans);background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
.mono{font-family:var(--mono)}

/* ============ login ============ */
#login{min-height:100dvh;display:grid;place-content:center;gap:.9rem;padding:1rem;
  width:min(92vw,340px);margin:0 auto;text-align:center}
#login .brand{font-family:var(--mono);font-weight:600;font-size:1.35rem;letter-spacing:.04em}
#login .brand b{color:var(--go)}
#login input{font:inherit;padding:.6rem .7rem;border:1px solid var(--line);border-radius:var(--r2);
  background:var(--card);color:var(--ink)}

/* ============ app shell ============ */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;align-self:start;height:100dvh;min-width:0;background:var(--side);color:var(--side-ink);
  display:flex;flex-direction:column;gap:.2rem;padding:1.1rem .8rem;border-right:1px solid var(--side-line)}
.brand{font-family:var(--mono);font-weight:600;font-size:1.25rem;letter-spacing:.06em;
  padding:.1rem .5rem .7rem;display:flex;align-items:center;gap:.5rem}
.brand .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--go-fill);
  box-shadow:0 0 0 3px rgba(26,162,119,.25)}
.side .search{position:relative;margin-bottom:.7rem}
#q{width:100%;padding:.5rem .7rem;font:inherit;color:var(--side-ink);
  background:rgba(255,255,255,.06);border:1px solid var(--side-line);border-radius:var(--r2)}
#q::placeholder{color:var(--side-mut)}
#q:focus{outline:2px solid var(--go-fill);outline-offset:1px}
.navlabel{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--side-mut);
  padding:.4rem .6rem .25rem}
nav{display:flex;flex-direction:column;gap:.15rem}
nav button{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;border:0;
  background:transparent;color:var(--side-ink);padding:.5rem .6rem;border-radius:var(--r2);
  transition:background .16s,color .16s}
nav button .ico{width:1.05rem;text-align:center;opacity:.85;font-size:.95rem}
nav button .lbl{flex:1}
nav button .cnt{font-family:var(--mono);font-size:.78rem;color:var(--side-mut);
  background:rgba(255,255,255,.06);padding:.02rem .42rem;border-radius:999px;min-width:1.5rem;text-align:center}
nav button:hover{background:rgba(255,255,255,.06)}
nav button.on{background:var(--side-ink);color:var(--side)}
nav button.on .cnt{background:rgba(0,0,0,.12);color:var(--side)}
.side-sp{flex:1}
.side .add{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;
  background:var(--go);color:#fff;border:0;border-radius:var(--r2);padding:.6rem;font-weight:600;
  transition:transform .12s,filter .16s;box-shadow:var(--sh1)}
.side .add:hover{filter:brightness(1.08)}
.side .add:active{transform:scale(.97)}
.side .foot{display:flex;justify-content:flex-end;align-items:center;padding:.7rem .5rem 0;margin-top:.6rem;
  border-top:1px solid var(--side-line);min-height:1.2rem}
.side .foot button{background:none;border:0;color:var(--side-mut);padding:0;font-size:.78rem;
  text-decoration:underline;text-underline-offset:2px}

.content{min-width:0;padding:1.6rem clamp(1rem,4vw,2.4rem) 5rem}
.wrap{max-width:1080px;margin:0 auto}

/* ============ view head ============ */
.vhead{display:flex;align-items:baseline;gap:.7rem;margin:.2rem 0 1.1rem;flex-wrap:wrap}
.vhead h2{margin:0;font-size:1.5rem;letter-spacing:-.01em}
.vhead .n{font-family:var(--mono);color:var(--mut);font-size:.9rem}
.vhead .warn{color:var(--p0);font-family:var(--mono);font-size:.85rem;font-weight:500}

/* ============ filters ============ */
.filters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:0 0 .9rem;
  padding:.6rem .7rem;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.fgrp{display:flex;gap:.3rem;align-items:center}
.fchip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:.22rem .6rem;
  font-size:.8rem;color:var(--ink2);font-family:var(--mono);transition:all .14s}
.fchip:hover{border-color:var(--mut)}
.fchip.on{color:#fff;border-color:transparent}
.fchip.on.P0{background:var(--p0)} .fchip.on.P1{background:var(--p1)}
.fchip.on.P2{background:var(--p2)} .fchip.on.P3{background:var(--p3)}
.fchip.on.plain{background:var(--ink);color:var(--bg)}
.filters select{font:inherit;font-size:.82rem;padding:.28rem .5rem;border:1px solid var(--line);
  border-radius:var(--r2);background:var(--card2);color:var(--ink)}
.filters .fsep{width:1px;align-self:stretch;background:var(--line);margin:0 .1rem}
.filters .clear{margin-left:auto;background:none;border:0;color:var(--mut);font-size:.8rem;
  text-decoration:underline;text-underline-offset:2px;padding:0}
.incdone{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--mut);cursor:pointer}
.incdone input{accent-color:var(--go)}

/* ============ cards / list ============ */
#list{display:flex;flex-direction:column;gap:.6rem}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh1);overflow:hidden;transition:box-shadow .18s,transform .18s,border-color .18s}
@media (hover:hover) and (pointer:fine){ .card:hover{box-shadow:var(--sh2);transform:translateY(-1px)} }
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sp,var(--p3))}
.card.P0{--sp:var(--p0)} .card.P1{--sp:var(--p1)} .card.P2{--sp:var(--p2)} .card.P3{--sp:var(--p3)}
.card.doneish{--sp:var(--line);background:var(--card2)}
.row{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem .85rem .7rem .95rem}
.t{flex:1;min-width:0}
.title{font-weight:600;overflow-wrap:anywhere;text-align:left;background:none;border:0;padding:0;
  font-size:.98rem;line-height:1.35}
button.title{transition:color .14s}
button.title:hover{color:var(--go)}
.doneish .title{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .55rem;font-family:var(--mono);font-size:.76rem;
  color:var(--mut);margin-top:.32rem;align-items:center}
.id{color:var(--mut)}
.pri{font-weight:600}
.P0-t{color:var(--p0)} .P1-t{color:var(--p1)} .P2-t{color:var(--p2)} .P3-t{color:var(--p3)}
.due.over{color:var(--p0);font-weight:600}
.due.today{color:var(--p1);font-weight:600}
.state{display:inline-flex;align-items:center;gap:.25rem}
.chip{font-family:var(--sans);font-size:.72rem;background:var(--bg2);color:var(--ink2);
  border-radius:6px;padding:.05rem .42rem}
.chip.done{background:rgba(18,122,91,.12);color:var(--go)}
.chip.cancel{background:var(--bg2);color:var(--mut);text-decoration:line-through}
.chip.block{background:rgba(229,72,77,.1);color:var(--p0)}
.ai{font-family:var(--sans);font-size:.66rem;letter-spacing:.03em;border:1px solid var(--line);
  color:var(--mut);border-radius:5px;padding:0 .3rem;opacity:.85}
.bar{height:5px;background:var(--bg2);border-radius:999px;margin-top:.5rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--go-fill);border-radius:999px;
  transition:width .5s cubic-bezier(.2,.8,.2,1)}
.card.doneish .bar i{background:var(--p3);opacity:.55}
.subs{margin:.5rem 0 .1rem;display:grid;gap:.25rem}
.subs .sub{display:flex;gap:.5rem;align-items:center;font-size:.88rem;color:var(--ink2)}
.subs .sub.sdone span{color:var(--mut);text-decoration:line-through}
.start{align-self:center;flex:none;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:.28rem .75rem;font-size:.82rem;font-weight:500;color:var(--ink2);
  transition:border-color .14s,color .14s,background .14s}
.start:hover{border-color:var(--go);color:var(--go)}

/* ---- custom check with ceremony ---- */
.check{position:relative;flex:none;width:1.35rem;height:1.35rem;margin-top:.08rem;padding:0;
  border:2px solid var(--line);border-radius:7px;background:var(--card);display:grid;place-items:center;
  transition:border-color .16s,background .16s}
.check.sm{width:1.05rem;height:1.05rem;border-radius:6px;margin-top:0}
.check:hover{border-color:var(--go)}
.check svg{width:100%;height:100%;stroke:#fff;stroke-width:3;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.check svg path{stroke-dasharray:24;stroke-dashoffset:24}
.check.checked{background:var(--go-fill);border-color:var(--go-fill)}
.check.checked svg path{stroke-dashoffset:0}
.check.celebrate{animation:pop .42s ease}
.check.celebrate svg path{animation:draw .38s .06s ease forwards}
.check.celebrate::after{content:"";position:absolute;inset:-3px;border-radius:9px;
  border:2px solid var(--go-fill);animation:ring .55s ease-out forwards}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.32)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
/* ---- collapse-on-complete ---- */
.card.collapsing{height:0!important;min-height:0;opacity:0;margin-top:calc(-.6rem);
  transform:translateX(8px);transition:height .34s ease,opacity .3s ease,transform .3s ease,margin .34s ease}
.card.collapsing .row{padding-top:0;padding-bottom:0}
/* ---- list enter stagger ---- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim>.card{animation:rise .34s both;animation-delay:calc(var(--i,0)*40ms)}

/* ============ dashboard ============ */
.dash-hd{display:flex;align-items:baseline;gap:.6rem;margin:.1rem 0 1.2rem}
.dash-hd .dow{font-size:1rem;color:var(--mut)}
.dash-hd .dnum{font-family:var(--mono);font-weight:600;font-size:2.5rem;letter-spacing:-.02em;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:1rem}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.9rem 1rem;
  box-shadow:var(--sh1);text-align:left;transition:transform .16s,box-shadow .18s,border-color .16s}
button.tile{cursor:pointer}
button.tile:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--mut)}
.tile .k{font-size:.78rem;color:var(--mut);display:flex;align-items:center;gap:.3rem}
.tile .k .arw{opacity:0;transition:opacity .16s,transform .16s;transform:translateX(-2px)}
button.tile:hover .k .arw{opacity:.7;transform:translateX(0)}
.tile .v{font-family:var(--mono);font-weight:600;font-size:2rem;line-height:1.1;margin-top:.15rem}
.tile.alert .v{color:var(--p0)} .tile.good .v{color:var(--go)}
.panels{display:grid;grid-template-columns:1.15fr 1fr;gap:.7rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;
  box-shadow:var(--sh1)}
.panel h3{margin:0 0 .8rem;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.panel.span2{grid-column:1/-1}
/* donut */
.donutwrap{display:flex;align-items:center;gap:1.6rem}
.donut{width:124px;height:124px;flex:none;animation:fadein .4s ease}
.donut .seg{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.dc-num{font-family:var(--mono);font-weight:600;font-size:26px;fill:var(--ink);text-anchor:middle}
.dc-lbl{font-size:11px;fill:var(--mut);text-anchor:middle}
@keyframes fadein{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.pmeter{flex:1;min-width:0;display:grid;gap:.7rem;font-family:var(--mono);font-size:.82rem}
.pmeter .r{display:grid;grid-template-columns:auto 1.4rem 1fr auto;gap:.55rem;align-items:center}
.pmeter .dot{width:.6rem;height:.6rem;border-radius:3px}
.pmeter .lbl{color:var(--mut)}
.pmeter .track{height:.5rem;background:var(--bg2);border-radius:999px;overflow:hidden}
.pmeter .track i{display:block;height:100%;border-radius:999px;transition:width .55s cubic-bezier(.2,.8,.2,1)}
.pmeter .num{color:var(--ink);font-weight:500}
/* status meter */
.smeter{display:grid;gap:.6rem}
.smeter .r{display:grid;grid-template-columns:5rem 1fr auto;align-items:center;gap:.6rem;font-size:.85rem}
.smeter .track{height:.5rem;background:var(--bg2);border-radius:999px;overflow:hidden}
.smeter .track i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
.smeter .num{font-family:var(--mono);color:var(--mut)}
/* completed-this-week cards */
.donecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem}
.dcard{border:1px solid var(--line);border-radius:var(--r2);padding:.6rem .7rem;background:var(--card2)}
.dcard .tt{font-weight:600;font-size:.9rem;display:flex;gap:.4rem;align-items:baseline}
.dcard .tt .ck{color:var(--go)}
.dcard .ln{font-family:var(--mono);font-size:.72rem;color:var(--mut);margin-top:.35rem;line-height:1.5}
.dcard .dur{color:var(--go);font-weight:500}
.empty{color:var(--mut);text-align:center;padding:2.5rem 1rem;font-size:.92rem}

/* ============ fab ============ */
#fab{display:none;position:fixed;right:1.1rem;bottom:1.1rem;width:3.4rem;height:3.4rem;border-radius:50%;
  border:0;background:var(--go);color:#fff;font-size:1.7rem;box-shadow:var(--sh2);z-index:20;transition:transform .12s}
#fab:active{transform:scale(.92)}

/* ============ dialogs ============ */
dialog{border:1px solid var(--line);border-radius:16px;width:min(94vw,480px);padding:1.1rem 1.2rem;
  background:var(--card);color:var(--ink);box-shadow:var(--sh2)}
dialog::backdrop{background:rgba(15,18,22,.45);backdrop-filter:blur(2px)}
dialog[open]{animation:dlg .22s cubic-bezier(.2,.8,.2,1)}
@keyframes dlg{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
dialog h3{margin:.1rem 0 .9rem;font-size:1.1rem}
dialog h3 .mono{color:var(--mut);font-size:.9rem}
form.grid{display:grid;gap:.7rem}
form.grid label{display:grid;gap:.25rem;font-size:.78rem;color:var(--mut)}
form.grid input,form.grid select,form.grid textarea{font:inherit;padding:.5rem .6rem;
  border:1px solid var(--line);border-radius:var(--r2);color:var(--ink);background:var(--card2)}
form.grid input:focus,form.grid select:focus,form.grid textarea:focus{outline:2px solid var(--go);outline-offset:0;border-color:transparent}
.subedit{display:grid;gap:.4rem}
.subedit .srow{display:flex;gap:.4rem}
.subedit .srow input{flex:1}
.subedit .srow button{flex:none;width:2.1rem;border:1px solid var(--line);border-radius:var(--r2);
  background:var(--card2);color:var(--mut);font-size:1.1rem;line-height:1}
.subedit .srow button:hover{color:var(--p0);border-color:var(--p0)}
.subadd{justify-self:start;background:none;border:1px dashed var(--line);border-radius:var(--r2);
  color:var(--mut);padding:.35rem .7rem;font-size:.82rem}
.subadd:hover{color:var(--go);border-color:var(--go)}
.actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.4rem}
.primary{background:var(--ink);color:var(--bg);border:0;border-radius:var(--r2);padding:.5rem 1.1rem;font-weight:600;
  transition:transform .12s,filter .16s}
.primary:hover{filter:brightness(1.1)} .primary:active{transform:scale(.97)}
.ghost{background:none;border:1px solid var(--line);border-radius:var(--r2);padding:.5rem .9rem;color:var(--ink2)}
.linkish{background:none;border:0;color:var(--go);padding:0}

/* ============ toast ============ */
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);border-radius:var(--r2);padding:.55rem 1rem;font-size:.88rem;
  opacity:0;transition:opacity .22s,transform .22s;max-width:90vw;pointer-events:none;z-index:40;box-shadow:var(--sh2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ responsive ============ */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;flex-direction:column;gap:.5rem;padding:.6rem .8rem;
    border-right:0;border-bottom:1px solid var(--side-line);z-index:15}
  .side .search{margin:0}
  .navlabel,.side-sp,.side .add,.side .foot{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:.3rem;scrollbar-width:none;min-width:0}
  nav::-webkit-scrollbar{display:none}
  nav button{width:auto;white-space:nowrap;padding:.4rem .7rem}
  nav button .ico{display:none}
  .content{padding:1.1rem .9rem 6rem}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .panels{grid-template-columns:1fr}
  .donutwrap{flex-direction:column;align-items:flex-start}
  .donutwrap .pmeter{width:100%}
  .dash-hd .dnum{font-size:2rem}
  #fab{display:block}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="brand">📋 <b>TODO</b> · 控制台</div>
  <input id="pw" type="password" placeholder="访问密码" autocomplete="current-password">
  <button id="loginBtn" class="primary">登录</button>
</div>

<div id="app" hidden>
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="dot"></span>TODO</div>
      <div class="search"><input id="q" type="search" placeholder="搜索…含归档，回车"></div>
      <div class="navlabel">视图</div>
      <nav id="tabs">
        <button data-v="report" class="on"><span class="ico">◱</span><span class="lbl">概览</span></button>
        <button data-v="today"><span class="ico">◉</span><span class="lbl">今天</span><span class="cnt" data-cnt="today">–</span></button>
        <button data-v="week"><span class="ico">▤</span><span class="lbl">本周</span><span class="cnt" data-cnt="week">–</span></button>
        <button data-v="blocked"><span class="ico">◼</span><span class="lbl">阻塞</span><span class="cnt" data-cnt="blocked">–</span></button>
        <button data-v="all"><span class="ico">☰</span><span class="lbl">全部</span><span class="cnt" data-cnt="all">–</span></button>
      </nav>
      <div class="side-sp"></div>
      <button class="add" id="addBtn">＋ 新增任务</button>
      <div class="foot"><button id="logoutBtn" hidden>登出</button></div>
    </aside>
    <div class="content"><div class="wrap">
      <div id="vhead" class="vhead"></div>
      <main id="list"></main>
    </div></div>
  </div>
  <button id="fab" title="新增任务">＋</button>
</div>

<dialog id="dlgAdd"><form class="grid" method="dialog">
  <h3>新增任务</h3>
  <label>标题 *<input name="title" required autocomplete="off"></label>
  <label>优先级<select name="priority"><option value="">P2（默认）</option>

<div id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let VIEW='report', INCLUDE_DONE=false, AUTH={auth_required:false,authenticated:true}, EDITING=null;
const DONE_DEFAULT={today:false,week:true,all:true,blocked:false};
let LAST_TASKS=[];
const FILTER={pri:new Set(),status:'',tag:'',range:'',overdue:false};
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const CHECK_SVG='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.5L19 7"/></svg>';
const VIEWS={today:'今天',week:'本周',blocked:'阻塞',all:'全部任务'};
const CN_DOW=['周日','周一','周二','周三','周四','周五','周六'];
const PC={P0:'var(--p0)',P1:'var(--p1)',P2:'var(--p2)',P3:'var(--p3)'};

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&!path.startsWith('/api/auth/login')){showLogin();throw new Error(d.error?.message||'需要登录')}
  if(!r.ok)throw new Error(d.error?.message||('HTTP '+r.status));
  return d;
}

/* 逻辑日：0:00–3:59 属前一天 */
function logicalDate(){return new Date(Date.now()-4*3600*1000)}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function logicalToday(){return iso(logicalDate())}
function esc(s){return String(s??'').replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ai(t,f){return (t.inferred||[]).includes(f)?' <span class="ai" title="该字段由 AI 推断">AI</span>':''}
function fmtMin(m){return m>=60?(m%60?`${Math.floor(m/60)}h${m%60}m`:`${m/60}h`):`${m}m`}
function fmtDur(a,b){const ms=new Date(b)-new Date(a);if(isNaN(ms)||ms<0)return'—';
  const mins=Math.round(ms/60000);if(mins<1)return '不到 1 分钟';if(mins<60)return mins+' 分钟';
  const h=Math.round(mins/60);if(h<24)return h+' 小时';
  const days=Math.round(h/24);return days+' 天'}
function dueHtml(t){if(!t.due)return'';const today=logicalToday();
  const active=t.status!=='done'&&t.status!=='cancelled';
  const cls=active&&t.due<today?'due over':active&&t.due===today?'due today':'due';
  const label=active&&t.due<today?'过期 '+t.due:active&&t.due===today?'今天 '+t.due:t.due;
  return `<span class="${cls}">${label}</span>`+ai(t,'due')}

function taskCard(t,readonly=false){
  const doneish=t.status==='done'||t.status==='cancelled';
  const subs=(t.subtasks||[]).map(st=>{
    const sd=st.status==='done';
    const attr=readonly?'disabled':sd?`data-reopensub="${st.id}"`:`data-donesub="${st.id}"`;
    return `<div class="sub ${sd?'sdone':''}">
      <button class="check sm ${sd?'checked':''}" ${attr} aria-label="${sd?'撤销子任务':'完成子任务'}">${CHECK_SVG}</button>
      <span>${esc(st.title)}</span></div>`}).join('');
  const stateChip=t.status==='in_progress'?'<span class="state">◐ 进行中</span>'
    :t.status==='done'?'<span class="chip done">✓ 已完成</span>'
    :t.status==='cancelled'?'<span class="chip cancel">已取消</span>'
    :t.status==='blocked'?`<span class="chip block">◼ ${esc(t.blocked_reason||'阻塞')}</span>`:'';
  const checkAttr=readonly?'disabled':doneish?`data-reopen="${t.id}"`:`data-done="${t.id}"`;
  return `<div class="card ${t.priority} ${doneish?'doneish':''}" data-card="${t.id}"><div class="row">
    <button class="check ${doneish?'checked':''}" ${checkAttr} aria-label="${doneish?'改回未完成':'完成任务'}">${CHECK_SVG}</button>
    <div class="t">
      <div>${readonly?`<span class="title">${esc(t.title)}</span>`
        :`<button class="title" data-edit="${t.id}">${esc(t.title)}</button>`}${ai(t,'title')}</div>
      <div class="meta">
        <span class="id">#${t.id}</span>
        <span class="pri ${t.priority}-t">${t.priority}</span>${ai(t,'priority')}
        ${dueHtml(t)}
        ${stateChip}
        ${t.recurrence?`<span>🔁 ${esc(t.recurrence)}</span>`+ai(t,'recurrence'):''}
        ${t.estimate_minutes?`<span>~${fmtMin(t.estimate_minutes)}</span>`+ai(t,'estimate'):''}
        ${(t.tags||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}${(t.tags||[]).length?ai(t,'tags'):''}
        ${t._source&&t._source!=='active'?`<span class="chip">${esc(t._source)}</span>`:''}
      </div>
      ${t.progress?`<div class="bar"><i style="width:${t.progress}%"></i></div>`:''}
      ${subs?`<div class="subs">${subs}</div>`:''}
    </div>
    ${!readonly&&t.status==='todo'?`<button class="start" data-start="${t.id}">开始</button>`:''}
  </div></div>`;
}

function paint(html,enter=false){
  const l=$('#list');l.className=enter&&!reduce?'anim':'';
  l.innerHTML=html;
  if(enter&&!reduce)$$('#list>.card').forEach((c,i)=>c.style.setProperty('--i',i));
}

/* ---------- filters (仅全部页) ---------- */
function tagOptions(){const s=new Set();LAST_TASKS.forEach(t=>(t.tags||[]).forEach(x=>s.add(x)));
  return [...s].sort()}
function filterActive(){return FILTER.pri.size||FILTER.status||FILTER.tag||FILTER.range||FILTER.overdue}
function applyFilters(tasks){
  const today=logicalToday(),d=logicalDate();
  const ws=new Date(d);ws.setDate(d.getDate()-((d.getDay()+6)%7));
  const we=new Date(ws);we.setDate(ws.getDate()+6);
  const wsS=iso(ws),weS=iso(we),ym=today.slice(0,7);
  return tasks.filter(t=>{
    if(FILTER.pri.size&&!FILTER.pri.has(t.priority))return false;
    if(FILTER.status&&t.status!==FILTER.status)return false;
    if(FILTER.tag&&!(t.tags||[]).includes(FILTER.tag))return false;
    if(FILTER.overdue){const act=t.status!=='done'&&t.status!=='cancelled';
      if(!(t.due&&t.due<today&&act))return false}
    if(FILTER.range){if(!t.due)return false;
      if(FILTER.range==='today'&&t.due!==today)return false;
      if(FILTER.range==='week'&&!(t.due>=wsS&&t.due<=weS))return false;
      if(FILTER.range==='month'&&t.due.slice(0,7)!==ym)return false}
    return true});
}
function filterBar(){
  const pri=['P0','P1','P2','P3'].map(p=>
    `<button class="fchip ${p} ${FILTER.pri.has(p)?'on':''}" data-fpri="${p}">${p}</button>`).join('');
  const tags=tagOptions().map(x=>`<option ${FILTER.tag===x?'selected':''}>${esc(x)}</option>`).join('');
  return `<div class="filters">
    <div class="fgrp">${pri}</div>
    <span class="fsep"></span>
    <select data-fstatus>
      <option value="">全部状态</option>
      ${['todo','in_progress','blocked','done','cancelled'].map(s=>
        `<option value="${s}" ${FILTER.status===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <select data-ftag><option value="">全部标签</option>${tags}</select>
    <select data-frange>
      <option value="">全部时间</option>
      <option value="today" ${FILTER.range==='today'?'selected':''}>今天到期</option>
      <option value="week" ${FILTER.range==='week'?'selected':''}>本周到期</option>
      <option value="month" ${FILTER.range==='month'?'selected':''}>本月到期</option>
    </select>
    <button class="fchip plain ${FILTER.overdue?'on':''}" data-foverdue>仅过期</button>
    <label class="incdone"><input type="checkbox" id="incDone" ${INCLUDE_DONE?'checked':''}> 含已完成/取消</label>
    ${filterActive()?'<button class="clear" data-fclear>清除筛选</button>':''}
  </div>`;
}

/* ---------- list render ---------- */
function renderList(enter){
  const today=logicalToday();
  let tasks=LAST_TASKS.slice();
  const isAll=VIEW==='all';
  if(isAll){tasks=applyFilters(tasks);tasks.sort((a,b)=>b.id-a.id)}   // 全部：序号倒序（最新在前）
  const over=tasks.filter(t=>t.due&&t.due<today&&t.status!=='done'&&t.status!=='cancelled').length;
  $('#vhead').innerHTML=`<h2>${VIEWS[VIEW]}</h2><span class="n">${tasks.length} 项</span>`
    +(over?`<span class="warn">${over} 过期</span>`:'');
  let head='';
  if(isAll)head=filterBar();
  else if(VIEW!=='blocked')head=`<label class="incdone" style="margin:0 0 .7rem">
    <input type="checkbox" id="incDone" ${INCLUDE_DONE?'checked':''}> 显示已完成 / 已取消</label>`;
  const body=tasks.length?tasks.map(t=>taskCard(t)).join('')
    :`<p class="empty">${isAll&&filterActive()?'没有符合筛选的任务':'这个视图暂时是空的 ✦'}</p>`;
  paint(head+body,enter);
}

/* 网页视图口径（与 CLI 的 today/week 独立，后端不改，见 iteration-2 §2.2）：
   今天/本周/全部 的「未完成」集合都是全部活跃任务（含无 DDL）；差别只在「已完成透镜」的
   时间窗——今天=今天打勾、本周=本周打勾、全部=所有已完成。判定用 completed_at（逻辑日）。 */
function logicalDateOf(ts){if(!ts)return null;return iso(new Date(new Date(ts).getTime()-4*3600*1000))}
function weekBounds(){const d=logicalDate();const ws=new Date(d);ws.setDate(d.getDate()-((d.getDay()+6)%7));
  const we=new Date(ws);we.setDate(ws.getDate()+6);return [iso(ws),iso(we)]}
function completedInWindow(t){
  if(VIEW==='all')return true;                        // 全部：所有已完成
  const cl=logicalDateOf(t.completed_at||t.updated_at);
  if(!cl)return false;
  if(VIEW==='week'){const [ws,we]=weekBounds();return cl>=ws&&cl<=we}
  return cl===logicalToday();                          // 今天
}

async function refresh(enter=false){
  if(VIEW==='report')return renderReport();
  let tasks;
  if(VIEW==='blocked'){
    const d=await api('/api/tasks?view=blocked');tasks=d.tasks;
  }else{
    const d=await api('/api/tasks?view=all&include_done=1');
    tasks=d.tasks.filter(t=>{
      const done=t.status==='done'||t.status==='cancelled';
      if(!done)return true;                            // 未完成：始终展示
      return INCLUDE_DONE&&completedInWindow(t);        // 已完成：开关 + 时间窗
    });
  }
  LAST_TASKS=tasks;
  renderList(enter);
  updateCounts();
}

/* ---------- dashboard ---------- */
function donut(dist){
  const order=['P0','P1','P2','P3'];
  const total=order.reduce((s,p)=>s+(dist[p]||0),0);
  const r=52,C=2*Math.PI*r;let off=0,segs='';
  order.forEach(p=>{const n=dist[p]||0;if(!n)return;const len=n/total*C;
    segs+=`<circle class="seg" r="${r}" cx="60" cy="60" fill="none" stroke="${PC[p]}" stroke-width="14"
      stroke-linecap="butt" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 60 60)"/>`;off+=len});
  const ring=total?segs:`<circle r="${r}" cx="60" cy="60" fill="none" stroke="var(--bg2)" stroke-width="14"/>`;
  return `<svg class="donut" viewBox="0 0 120 120">${ring}
    <text class="dc-num" x="60" y="60">${total}</text>
    <text class="dc-lbl" x="60" y="78">项活跃</text></svg>`;
}

async function renderReport(){
  const r=await api('/api/report');
  const d=logicalDate();
  const dist=r.by_priority;
  const pTotal=['P0','P1','P2','P3'].reduce((s,p)=>s+(dist[p]||0),0)||1;
  const pbars=['P0','P1','P2','P3'].map(p=>{const n=dist[p]||0,pct=Math.round(n/pTotal*100);
    return `<div class="r"><span class="dot" style="background:${PC[p]}"></span><span class="lbl">${p}</span>
      <div class="track"><i style="width:${pct}%;background:${PC[p]}"></i></div>
      <span class="num">${n}</span></div>`}).join('');
  const st=r.by_status,stTotal=(st.todo+st.in_progress+st.blocked)||1;
  const meter=(lbl,n,col)=>`<div class="r"><span>${lbl}</span>
    <div class="track"><i style="width:${Math.round(n/stTotal*100)}%;background:${col}"></i></div>
    <span class="num">${n}</span></div>`;
  const hrs=Math.round(r.estimate_minutes_total/6)/10;
  const done=r.completed_this_week;
  $('#vhead').innerHTML='';
  paint(`
  <div class="dash-hd"><span class="dow">${CN_DOW[d.getDay()]}</span>
    <span class="dnum">${String(d.getMonth()+1).padStart(2,'0')}·${String(d.getDate()).padStart(2,'0')}</span></div>
  <div class="tiles">
    <button class="tile good" data-jump="week"><div class="k">本周完成 <span class="arw">→</span></div><div class="v">${done.length}</div></button>
    <button class="tile" data-jump="backlog"><div class="k">积压中 <span class="arw">→</span></div><div class="v">${r.active}</div></button>
    <button class="tile ${r.overdue?'alert':''}" data-jump="overdue"><div class="k">已过期 <span class="arw">→</span></div><div class="v">${r.overdue}</div></button>
    <div class="tile"><div class="k">预估剩余</div><div class="v">${hrs}<span style="font-size:1rem;color:var(--mut)">h</span></div></div>
  </div>
  <div class="panels">
    <div class="panel"><h3>优先级分布</h3>
      <div class="donutwrap">${donut(dist)}<div class="pmeter">${pbars}</div></div></div>
    <div class="panel"><h3>状态</h3><div class="smeter">
      ${meter('待办',st.todo,'var(--p3)')}
      ${meter('进行中',st.in_progress,'var(--go-fill)')}
      ${meter('阻塞',st.blocked,'var(--p0)')}
    </div></div>
    <div class="panel span2"><h3>本周完成 · ${done.length}</h3>
      ${done.length?`<div class="donecards">${done.map(t=>`
        <div class="dcard"><div class="tt"><span class="ck">✓</span><span>${esc(t.title)}</span></div>
          <div class="ln">创建 ${fmtTs(t.created_at)} → 完成 ${fmtTs(t.completed_at)}<br>
          用时 <span class="dur">${fmtDur(t.created_at,t.completed_at)}</span>${t.estimate_minutes?` · 预估 ${fmtMin(t.estimate_minutes)}`:''}</div></div>`).join('')}</div>`
        :'<p class="empty" style="padding:1rem">本周还没有完成的任务，去搞定一件吧 ✦</p>'}</div>
  </div>`);
  requestAnimationFrame(()=>$$('.donut .seg').forEach(s=>{const v=s.getAttribute('stroke-dashoffset');
    s.style.strokeDashoffset='0';requestAnimationFrame(()=>s.style.strokeDashoffset=v)}));
  updateCounts();
}
function fmtTs(s){if(!s)return'—';const d=new Date(s);
  return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

/* 徽标 = 各视图默认所见的条数：今天/全部=未完成数；本周=未完成+本周打勾；阻塞=当前阻塞数 */
async function updateCounts(){
  try{
    const d=await api('/api/tasks?view=all&include_done=1');
    const active=d.tasks.filter(t=>t.status!=='done'&&t.status!=='cancelled');
    const [ws,we]=weekBounds();
    const weekDone=d.tasks.filter(t=>{
      if(t.status!=='done'&&t.status!=='cancelled')return false;
      const cl=logicalDateOf(t.completed_at||t.updated_at);return cl&&cl>=ws&&cl<=we}).length;
    const set=(v,n)=>{const el=$(`[data-cnt="${v}"]`);if(el)el.textContent=n};
    // 徽标 = 各视图默认所见条数：今天=未完成；本周=未完成+本周打勾；全部=总数。今天≤本周≤全部
    set('today',active.length);
    set('week',active.length+weekDone);
    set('all',d.tasks.length);
    set('blocked',active.filter(t=>t.status==='blocked').length);
  }catch(e){}
}

async function doSearch(q){
  const d=await api('/api/search?q='+encodeURIComponent(q));
  $('#vhead').innerHTML=`<h2>搜索</h2><span class="n">“${esc(q)}” · ${d.matches.length} 项</span>`;
  $$('#tabs button').forEach(x=>x.classList.remove('on'));
  paint(d.matches.length?d.matches.map(t=>taskCard(t,t._source!=='active')).join('')
    :'<p class="empty">没有匹配的任务</p>',true);
}

/* ---------- ceremony ---------- */
async function completeTask(btn,id){
  if(reduce){await api(`/api/tasks/${id}/done`,{method:'POST'});toast('已完成');return refresh()}
  btn.classList.add('celebrate','checked');
  await new Promise(r=>setTimeout(r,430));
  if(!INCLUDE_DONE){const card=btn.closest('.card');
    if(card){card.style.height=card.offsetHeight+'px';card.getBoundingClientRect();
      card.classList.add('collapsing');await new Promise(r=>setTimeout(r,320))}}
  try{await api(`/api/tasks/${id}/done`,{method:'POST'});toast('已完成 ✓')}
  finally{await refresh()}
}

$('#list').addEventListener('click',async e=>{
  const el=e.target.closest('button');if(!el)return;
  const ds=el.dataset;
  try{
    if(ds.done){el.disabled=true;await completeTask(el,ds.done)}
    else if(ds.reopen){el.disabled=true;
      await api(`/api/tasks/${ds.reopen}`,{method:'PATCH',body:JSON.stringify({status:'todo'})});
      toast('已改回未完成');await refresh()}
    else if(ds.donesub){el.disabled=true;el.classList.add('celebrate','checked');
      await new Promise(r=>setTimeout(r,300));
      await api(`/api/tasks/${ds.donesub}/done`,{method:'POST'});
      const pid=ds.donesub.split('.')[0];
      const d=await api('/api/tasks/'+pid);
      const subs=d.task.subtasks||[];
      if(subs.length&&subs.every(s=>s.status==='done')&&d.task.status!=='done'){
        await api(`/api/tasks/${pid}/done`,{method:'POST'});toast('子任务全部完成，已自动完成任务 ✓')}
      else toast('子任务已完成');
      await refresh()}
    else if(ds.reopensub){el.disabled=true;
      await api(`/api/tasks/${ds.reopensub}`,{method:'PATCH',body:JSON.stringify({status:'todo'})});
      toast('子任务已撤销');await refresh()}
    else if(ds.start){await api(`/api/tasks/${ds.start}`,{method:'PATCH',
      body:JSON.stringify({status:'in_progress'})});toast('已开始');await refresh()}
    else if(ds.edit){await openEdit(ds.edit)}
    else if(ds.jump){doJump(ds.jump)}
    else if(ds.fpri!==undefined){FILTER.pri.has(ds.fpri)?FILTER.pri.delete(ds.fpri):FILTER.pri.add(ds.fpri);renderList(false)}
    else if(ds.foverdue!==undefined){FILTER.overdue=!FILTER.overdue;renderList(false)}
    else if(ds.fclear!==undefined){clearFilters();renderList(false)}
  }catch(err){toast(err.message);refresh().catch(()=>{})}
});
$('#list').addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='incDone'){INCLUDE_DONE=t.checked;await refresh()}
  else if(t.dataset.fstatus!==undefined){FILTER.status=t.value;
    if((t.value==='done'||t.value==='cancelled')&&!INCLUDE_DONE){INCLUDE_DONE=true;await refresh()}
    else renderList(false)}
  else if(t.dataset.ftag!==undefined){FILTER.tag=t.value;renderList(false)}
  else if(t.dataset.frange!==undefined){FILTER.range=t.value;renderList(false)}
});

function clearFilters(){FILTER.pri.clear();FILTER.status='';FILTER.tag='';FILTER.range='';FILTER.overdue=false}
function switchView(v){VIEW=v;$('#q').value='';INCLUDE_DONE=DONE_DEFAULT[v]??false;
  $$('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.v===v))}
function doJump(kind){
  clearFilters();
  if(kind==='week')switchView('week');
  else if(kind==='backlog'){switchView('all');INCLUDE_DONE=false}      // 积压=仅活跃
  else if(kind==='overdue'){switchView('all');INCLUDE_DONE=false;FILTER.overdue=true}
  refresh(true).catch(err=>toast(err.message));
}

$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  switchView(b.dataset.v);refresh(true).catch(err=>toast(err.message))});
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.value.trim())doSearch(e.target.value.trim()).catch(err=>toast(err.message))});

/* ---------- 动态子任务行 ---------- */
function subRow(val=''){const d=document.createElement('div');d.className='srow';
  d.innerHTML=`<input placeholder="子任务…" value="${esc(val)}"><button type="button" title="删除">×</button>`;
  d.querySelector('button').onclick=()=>d.remove();return d}
function resetSubRows(c){c.innerHTML='';c.appendChild(subRow())}
function collectSubs(c){return $$('input',c).map(i=>i.value.trim()).filter(Boolean)}
$('#subAdd').onclick=()=>{const c=$('#subRows');c.appendChild(subRow());c.lastChild.querySelector('input').focus()};
$('#subAddEdit').onclick=()=>{const c=$('#subRowsEdit');c.appendChild(subRow());c.lastChild.querySelector('input').focus()};

function openAdd(){$('#dlgAdd form').reset();resetSubRows($('#subRows'));$('#dlgAdd').showModal()}
$('#addBtn').onclick=openAdd;$('#fab').onclick=openAdd;
$$('dialog [data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());

$('#dlgAdd form').addEventListener('submit',async e=>{
  e.preventDefault();
  const f=new FormData(e.target),b={title:String(f.get('title')).trim()};
  if(f.get('priority'))b.priority=f.get('priority');
  if(f.get('due'))b.due=f.get('due');
  const tags=String(f.get('tags')).split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  if(tags.length)b.tags=tags;
  if(String(f.get('recurrence')).trim())b.recurrence=String(f.get('recurrence')).trim();
  if(f.get('estimate'))b.estimate=+f.get('estimate');
  const subs=collectSubs($('#subRows'));if(subs.length)b.subtasks=subs;
  if(String(f.get('notes')).trim())b.notes=String(f.get('notes')).trim();
  try{const d=await api('/api/tasks',{method:'POST',body:JSON.stringify(b)});
    $('#dlgAdd').close();toast(`已添加 #${d.task.id}`);await refresh()}
  catch(err){toast(err.message)}
});

async function openEdit(id){
  const d=await api('/api/tasks/'+id);EDITING=d.task;
  const f=$('#dlgEdit form');f.reset();
  $('#editId').textContent='#'+EDITING.id;
  f.elements.title.value=EDITING.title;
  f.elements.status.value=EDITING.status;
  f.elements.blocked_reason.value=EDITING.blocked_reason||'';
  f.elements.priority.value=EDITING.priority;
  f.elements.due.value=EDITING.due||'';
  f.elements.tags.value=(EDITING.tags||[]).join(',');
  f.elements.recurrence.value=EDITING.recurrence||'';
  f.elements.estimate.value=EDITING.estimate_minutes||'';
  f.elements.progress.value=EDITING.progress??'';
  f.elements.progress.disabled=(EDITING.subtasks||[]).length>0;
  f.elements.notes.value=EDITING.notes||'';
  $('#reasonRow').hidden=EDITING.status!=='blocked';
  $('#subRowsEdit').innerHTML='';
  $('#dlgEdit').showModal();
}
$('#dlgEdit [name=status]').addEventListener('change',
  e=>{$('#reasonRow').hidden=e.target.value!=='blocked'});
$('#dlgEdit form').addEventListener('submit',async e=>{
  e.preventDefault();
  const f=new FormData(e.target),t=EDITING,b={};
  const title=String(f.get('title')).trim();
  if(title&&title!==t.title)b.title=title;
  if(f.get('status')!==t.status)b.status=f.get('status');
  if((b.status||t.status)==='blocked'&&String(f.get('blocked_reason')).trim())
    b.blocked_reason=String(f.get('blocked_reason')).trim();
  if(f.get('priority')!==t.priority)b.priority=f.get('priority');
  const due=f.get('due')||null;if(due!==(t.due||null))b.due=due;
  const tags=String(f.get('tags')).split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  if(tags.join(',')!==(t.tags||[]).join(','))b.tags=tags;
  const rec=String(f.get('recurrence')).trim()||null;
  if(rec!==(t.recurrence||null))b.recurrence=rec;
  if(f.get('estimate')&&+f.get('estimate')!==t.estimate_minutes)b.estimate=+f.get('estimate');
  const pEl=$('#dlgEdit [name=progress]');
  if(!pEl.disabled&&pEl.value!==''&&+pEl.value!==t.progress)b.progress=+pEl.value;
  if(f.get('notes')!==(t.notes||''))b.notes=f.get('notes');
  try{
    if(Object.keys(b).length)await api('/api/tasks/'+t.id,{method:'PATCH',body:JSON.stringify(b)});
    for(const s of collectSubs($('#subRowsEdit')))
      await api(`/api/tasks/${t.id}/subtasks`,{method:'POST',body:JSON.stringify({title:s})});
    $('#dlgEdit').close();toast('已保存');await refresh();
  }catch(err){toast(err.message)}
});

function showLogin(){$('#app').hidden=true;$('#login').hidden=false;$('#pw').focus()}
function showApp(){$('#login').hidden=true;$('#app').hidden=false;
  $('#logoutBtn').hidden=!AUTH.auth_required;
  refresh(true).catch(err=>toast(err.message))}
$('#loginBtn').onclick=async()=>{
  try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});
    AUTH.authenticated=true;$('#pw').value='';showApp()}
  catch(err){toast(err.message)}};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});
$('#logoutBtn').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}catch(e){}showLogin()};

(async function init(){
  try{AUTH=await api('/api/status');
    if(AUTH.auth_required&&!AUTH.authenticated)showLogin();else showApp()}
  catch(err){toast('无法连接服务: '+err.message)}
})();
</script>
